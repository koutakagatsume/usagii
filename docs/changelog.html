<!doctype html>
<html lang="ja">
<head>

<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  :root{color-scheme:light;--bg:#FBF1E7;--surface:#fff;--fg:#2A211B;--fg2:#5b524a;--line:rgba(42,33,27,.12);--link:#B14422}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#19140F;--surface:#241D16;--fg:#F2E9DF;--fg2:#c2b4a6;--line:rgba(242,233,223,.14);--link:#EE9B7C}}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#19140F;--surface:#241D16;--fg:#F2E9DF;--fg2:#c2b4a6;--line:rgba(242,233,223,.14);--link:#EE9B7C}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Hiragino Sans','Yu Gothic UI','Segoe UI',sans-serif;line-height:1.95;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
  a{color:var(--link);text-decoration:none}
  a:hover{text-decoration:underline}
  .cl-body p{margin:6px 0 0}
  .cl-body ul{margin:8px 0 0;padding-left:1.4em}
  .cl-body li{margin-top:3px}
  @media (max-width:560px){ .ub-pad{padding-left:20px!important;padding-right:20px!important} }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
</style>
<style>
[data-uh0]:hover{background:rgba(255,255,255,.28) !important}
[data-uh1]:hover{background:#FFE9DF !important}
[data-uh2]:hover{color:#fff !important}
[data-uh3]:hover{color:#fff !important}
[data-uh4]:hover{color:#fff !important}
[data-uh5]:hover{color:#fff !important}
[data-uh6]:hover{color:#fff !important}
</style>
</head>
<body>
<div style="overflow-x:clip;min-height:100vh;display:flex;flex-direction:column">

<header style="position:sticky;top:0;z-index:50;background:#D85A30">
  <div class="ub-pad" style="max-width:920px;margin:0 auto;padding:13px 26px;display:flex;align-items:center;gap:13px">
    <a href="index.html" style="display:flex;align-items:center;gap:11px">
      <svg viewBox="0 0 1024 1024" width="26" height="26" aria-hidden="true" style="flex:none"><g fill="#fff"><rect x="352" y="156" width="136" height="384" rx="68" transform="rotate(-14 420 348)"/><rect x="536" y="156" width="136" height="384" rx="68" transform="rotate(14 604 348)"/><circle cx="512" cy="648" r="248"/></g></svg>
      <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:19px;color:#fff;letter-spacing:.02em">usagii</span>
    </a>
    <nav style="margin-left:auto;display:flex;align-items:center;gap:14px">
      <button id="ubTheme" type="button" aria-label="テーマを切り替え" style="border:none;background:rgba(255,255,255,.16);color:#fff;width:34px;height:34px;border-radius:999px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none" data-uh0><svg id="ubMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg id="ubSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a href="https://github.com/koutakagatsume/usagii/releases/latest/download/usagii-setup.exe" style="font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:14px;color:#D85A30;background:#fff;padding:9px 18px;border-radius:999px;letter-spacing:.02em" data-uh1>ダウンロード</a>
    </nav>
  </div>
</header>

<main class="ub-pad" style="flex:1;max-width:780px;margin:0 auto;width:100%;padding:clamp(40px,7vh,72px) 26px clamp(56px,10vh,96px)">
  <a href="index.html" style="font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13.5px;color:var(--link)">← usagii トップへ</a>

  <div style="margin:26px 0 0">
    <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:12.5px;letter-spacing:.1em;color:#fff;background:#D85A30;padding:6px 16px;border-radius:999px">更新履歴</span>
    <h1 style="margin:18px 0 8px;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:clamp(28px,5.4vw,44px);line-height:1.3;color:var(--fg)">更新履歴</h1>
    <p style="margin:0;font-size:13.5px;color:var(--fg2);text-wrap:pretty">各バージョンの変更点です。インストーラを実行するだけで上書き更新でき、予定データは引き継がれます。</p>
  </div>

  <div id="list" style="margin-top:8px"><p style="margin-top:32px;font-size:14px;color:var(--fg2)">読み込み中…</p></div>

  <p style="margin:40px 0 0"><a href="index.html" style="font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:13.5px;color:var(--link)">← usagii トップへ</a></p>
</main>

<footer style="background:#2A211B;color:#b4a99f">
  <div class="ub-pad" style="max-width:920px;margin:0 auto;padding:40px 26px 52px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12.5px">
    <span style="font-family:'Zen Maru Gothic',sans-serif;font-weight:900;color:#E8693F;font-size:16px">usagii</span>
    <span>© 2026 usagii project</span>
    <a href="https://github.com/koutakagatsume/usagii" style="color:#d3cabf" data-uh2>GitHub</a>
    <a href="changelog.html" style="color:#d3cabf" data-uh3>更新履歴</a>
    <a href="privacy.html" style="color:#d3cabf" data-uh4>プライバシー・免責事項</a>
    <a href="verify.html" style="color:#d3cabf" data-uh5>通信の検証方法</a>
    <a href="usagi.html" style="color:#d3cabf" data-uh6>名前の由来</a>
  </div>
</footer>

</div>
<script>
class DCLogic{setState(){}forceUpdate(){}}
class Component extends DCLogic {
  componentDidMount() { this._initTheme(); this._loadReleases(); }
  _initTheme() {
    const root = document.documentElement, KEY = 'usagii-lp-theme';
    const mq = window.matchMedia('(prefers-color-scheme:dark)');
    const resolve = () => { const p = localStorage.getItem(KEY); return (p === 'dark' || p === 'light') ? p : (mq.matches ? 'dark' : 'light'); };
    const sun = document.getElementById('ubSun'), moon = document.getElementById('ubMoon');
    const apply = () => {
      const p = localStorage.getItem(KEY);
      if (p === 'dark' || p === 'light') root.setAttribute('data-theme', p); else root.removeAttribute('data-theme');
      const eff = resolve();
      if (sun && moon) { sun.style.display = eff === 'dark' ? '' : 'none'; moon.style.display = eff === 'dark' ? 'none' : ''; }
    };
    apply();
    const btn = document.getElementById('ubTheme');
    if (btn) btn.addEventListener('click', () => { localStorage.setItem(KEY, resolve() === 'dark' ? 'light' : 'dark'); apply(); });
    if (mq.addEventListener) mq.addEventListener('change', () => { if (!localStorage.getItem(KEY)) apply(); });
  }
  _loadReleases() {
    const REPO = 'koutakagatsume/usagii';
    const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const md = body => {
      if (!body || !body.trim()) return '<p>(変更点の記載はありません)</p>';
      const out = []; let ul = [];
      const flush = () => { if (ul.length) { out.push('<ul>' + ul.map(li => '<li>' + li + '</li>').join('') + '</ul>'); ul = []; } };
      body.split(/\r?\n/).forEach(line => {
        const t = line.trim();
        if (!t) { flush(); return; }
        const m = t.match(/^[-*]\s+(.+)/);
        if (m) { ul.push(esc(m[1])); return; }
        flush();
        out.push('<p>' + esc(t.replace(/^#+\s*/, '')) + '</p>');
      });
      flush();
      return out.join('');
    };
    const dateStr = iso => { const d = new Date(iso); return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
    const list = document.getElementById('list');
    const cardOpen = 'margin-top:20px;background:var(--surface);border:2.5px solid var(--fg);border-radius:22px;padding:24px 26px;box-shadow:6px 6px 0 0 var(--fg)';
    fetch('https://api.github.com/repos/' + REPO + '/releases?per_page=50')
      .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
      .then(rels => {
        const items = rels.filter(r => !r.draft && !r.prerelease);
        if (!items.length) { list.innerHTML = '<p style="margin-top:32px;font-size:14px;color:var(--fg2)">まだリリースがありません。</p>'; return; }
        list.innerHTML = items.map((r, i) => {
          const assets = r.assets || [];
          const exe = assets.find(a => a.name !== 'usagii-setup.exe' && a.name.endsWith('-setup.exe')) || assets.find(a => a.name.endsWith('.exe'));
          return '<article style="' + cardOpen + '">' +
            '<h2 style="font-family:\'Zen Maru Gothic\',sans-serif;font-weight:900;font-size:21px;color:#D85A30;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0">' +
              esc(r.tag_name) +
              (i === 0 ? '<span style="font-size:11px;font-family:\'Zen Maru Gothic\',sans-serif;font-weight:700;background:#D85A30;color:#fff;padding:3px 11px;border-radius:999px">最新</span>' : '') +
              '<span style="font-family:\'Hiragino Sans\',sans-serif;font-weight:400;font-size:12.5px;color:var(--fg2)">' + dateStr(r.published_at) + '</span></h2>' +
            '<div class="cl-body" style="margin-top:10px;font-size:14px;color:var(--fg2)">' + md(r.body) + '</div>' +
            '<div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:16px">' +
              (exe ? '<a style="font-family:\'Zen Maru Gothic\',sans-serif;font-weight:700;font-size:13px;color:var(--link);border-bottom:2px solid rgba(216,90,48,.3)" href="' + esc(exe.browser_download_url) + '">このバージョンをダウンロード</a>' : '') +
              '<a style="font-family:\'Zen Maru Gothic\',sans-serif;font-weight:700;font-size:13px;color:var(--link);border-bottom:2px solid rgba(216,90,48,.3)" href="' + esc(r.html_url) + '">詳細 (GitHub) →</a>' +
            '</div></article>';
        }).join('');
      })
      .catch(() => {
        list.innerHTML = '<p style="margin-top:32px;font-size:14px;color:var(--fg2)">履歴を取得できませんでした。<a href="https://github.com/' + REPO + '/releases" style="color:var(--link);font-weight:700">GitHub の Releases</a> をご覧ください。</p>';
      });
  }
  renderVals() { return {}; }
}
document.addEventListener("DOMContentLoaded",function(){try{var c=new Component();if(c.componentDidMount)c.componentDidMount();}catch(e){console.error(e);}});
</script>
</body>
</html>
